name: USP RC Monitor

# Esecuzione automatica + possibilita' di lancio manuale dal tab "Actions".
on:
  schedule:
    # Cron in UTC. Italia: estate (CEST) = UTC+2, inverno (CET) = UTC+1.
    # Due controlli al giorno (orari ora italiana d'estate):
    - cron: "0 10 * * *"   # 12:00 - colpo d'occhio sugli avvisi mattutini
    - cron: "0 17 * * *"   # 19:00 - rete di sicurezza dopo la chiusura uffici
  workflow_dispatch: {}  # bottone "Run workflow" manuale

# Permesso necessario per ri-committare state.json nel repo.
permissions:
  contents: write

# Evita run sovrapposti che corromperebbero lo stato.
concurrency:
  group: usp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Filtra solo le categorie rilevanti per te. Lascia vuoto per ricevere tutto.
          CATEGORIES: "grad,doc,recl,avvisi"
          PER_PAGE: "30"
          STATE_FILE: "state.json"
        run: python monitor.py

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "usp-monitor-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "chore: update state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "Nessuna modifica allo stato."
          fi
