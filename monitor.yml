name: USP RC Monitor

# Esecuzione automatica + possibilita' di lancio manuale dal tab "Actions".
on:
  schedule:
    # Cron in UTC. Italia: estate (CEST) = UTC+2, inverno (CET) = UTC+1.
    # Ogni ora nella fascia diurna: 05:00-20:00 UTC = ~07:00-22:00 ora italiana (estate).
    # I controlli notturni sarebbero a vuoto (l'ufficio pubblica solo in orario di servizio).
    # Per il controllo 24/7 puro, sostituisci con:  - cron: "0 * * * *"
    - cron: "0 5-20 * * *"
  workflow_dispatch: {}  # bottone "Run workflow" manuale

# Permesso necessario per ri-committare state.json nel repo.
permissions:
  contents: write

# Evita run sovrapposti che corromperebbero lo stato.
concurrency:
  group: usp-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Filtra solo le categorie rilevanti per te. Lascia vuoto per ricevere tutto.
          CATEGORIES: "grad,doc,recl,avvisi"
          PER_PAGE: "30"
          STATE_FILE: "state.json"
        run: python monitor.py

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "usp-monitor-bot"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "chore: update state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "Nessuna modifica allo stato."
          fi

      # --- Affidabilita' ---

      # Dead-man's switch: ping a un watchdog esterno (es. healthchecks.io) a ogni
      # run riuscito. Se i ping si interrompono - perche' il workflow si e' fermato
      # o GitHub l'ha sospeso - e' il watchdog ad avvisarti. E' la rete di sicurezza
      # che un heartbeat auto-inviato NON puo' dare (un bot morto non puo' avvisare
      # di essere morto). Opzionale: attivo solo se imposti il secret HEALTHCHECK_URL.
      - name: Dead-man's switch ping
        if: success()
        env:
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HEALTHCHECK_URL" ]; then
            curl -fsS -m 10 --retry 3 "$HEALTHCHECK_URL" && echo "Ping inviato."
          else
            echo "HEALTHCHECK_URL non impostato: salto il ping (dead-man's switch disattivato)."
          fi

      # Alert privato all'admin se QUALSIASI step precedente fallisce.
      # Va alla tua chat personale (TELEGRAM_ADMIN_CHAT_ID), non sul canale pubblico.
      - name: Notify admin on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ADMIN_ID" ]; then
            echo "TELEGRAM_ADMIN_CHAT_ID non impostato: niente alert."
            exit 0
          fi
          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${ADMIN_ID}" \
            --data-urlencode parse_mode="HTML" \
            --data-urlencode text="⚠️ <b>USP Monitor: run FALLITO</b>%0AControlla i log: ${RUN_URL}"
