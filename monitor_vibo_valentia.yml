name: Monitor USP Vibo Valentia

on:
  schedule:
    - cron: "10 5-20 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: usp-monitor-vv
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SITE_BASE_URL: "https://www.istruzione.calabria.it/vibovalentia"
          STATE_FILE: "state_vibo_valentia.json"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_VV_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_VV_CHAT_ID }}
          CATEGORIES: "" # Lascia vuoto per ricevere tutte le categorie di Vibo, oppure inserisci i loro slug
        run: python monitor.py

      - name: Commit state if changed
        run: |
          if [[ -n "$(git status --porcelain state_vibo_valentia.json)" ]]; then
            git config user.name  "usp-monitor-bot"
            git config user.email "actions@github.com"
            git add state_vibo_valentia.json
            git commit -m "chore: update VV state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          else
            echo "Nessuna modifica allo stato."
          fi
