name: USP RC Monitor

on:
  schedule:
    # Slot temporari di test (orari italiani CEST -> UTC):
    # 10:00, 13:00, 15:30, 18:00, 23:00 IT
    - cron: "0 8 * * *"
    - cron: "0 11 * * *"
    - cron: "30 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Monitor Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_RC }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_RC }}
          CATEGORIES: ""
          PROVINCIA: "Reggio Calabria"
          SITE_BASE_URL: "https://www.istruzioneatprc.it"
          STATE_FILE: "state_reggio_calabria.json"
          ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_RC }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python monitor.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update state_reggio_calabria.json [skip ci]"
          file_pattern: "state_reggio_calabria.json"

      # Avviso Telegram all'amministratore solo se il run fallisce.
      # Usa il bot RC perché è l'unico abilitato a inviare DM in privato.
      - name: Notifica fallimento su Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN_RC }}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            --data-urlencode text="⚠️ Workflow FALLITO: USP RC Monitor
            Run: ${{ github.run_id }}
            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
