name: USP KR Monitor

on:
  schedule:
    # Ogni 30 min nelle ore attive (05-20 UTC = 07-22 IT in ora legale).
    # Minuti sfasati per provincia per non colpire il sito e il push tutti insieme.
    - cron: "24,54 5-20 * * *"
  workflow_dispatch:

# Concurrency PER-PROVINCIA (group diverso per ciascuna): impedisce che un run si sovrapponga
# al precedente della stessa provincia (stesso state file → possibile conflitto di rebase).
# Province diverse hanno group diversi, quindi continuano a girare in parallelo.
concurrency:
  group: monitor-crotone
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PUSH_TOKEN }}
          fetch-depth: 0  # storia completa: serve al rebase affidabile nello step di push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Monitor Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_KR }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_KR }}
          CATEGORIES: ""
          PROVINCIA: "Crotone"
          SITE_BASE_URL: "https://www.istruzione.calabria.it/crotone"
          STATE_FILE: "state_crotone.json"
          PER_PAGE: "15"
          PROXY_URL: ${{ secrets.PROXY_URL }}
          PROXY_FIRST: "1"
          ADMIN_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_RC }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
        run: python monitor.py

      # Commit + push dello stato con retry: i 5 workflow ora girano in parallelo, quindi il
      # push su master può trovarsi indietro (race). Invece di fallire (come l'auto-commit),
      # si riallinea con rebase e riprova. Province diverse toccano file di stato diversi,
      # quindi il rebase non genera mai conflitti: converge sempre.
      - name: Commit and push state (retry anti-race)
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state_crotone.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica di stato: niente da committare."
            exit 0
          fi
          git commit -m "chore: auto-update state_crotone.json [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:master; then
              echo "Push riuscito (tentativo $attempt)."
              exit 0
            fi
            echo "Push rifiutato (race), riallineo con rebase e riprovo ($attempt)…"
            git pull --rebase --autostash origin master || true
            sleep $((RANDOM % 4 + 1))
          done
          echo "Push fallito dopo 6 tentativi." >&2
          exit 1

      # Avviso Telegram all'amministratore solo se il run fallisce.
      # Usa il bot RC perché è l'unico abilitato a inviare DM in privato.
      - name: Notifica fallimento su Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN_RC }}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            --data-urlencode text="⚠️ Workflow FALLITO: USP KR Monitor
            Run: ${{ github.run_id }}
            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
