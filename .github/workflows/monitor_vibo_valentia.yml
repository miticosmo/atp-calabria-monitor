name: USP VV Monitor

on:
  schedule:
    - cron: "10 5-20 * * *"
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOT_PUSH_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Monitor Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_VV }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID_VV }}
          CATEGORIES: ""
          PROVINCIA: "Vibo Valentia"
          SITE_BASE_URL: "https://www.istruzione.calabria.it/vibovalentia"
          STATE_FILE: "state_vibo_valentia.json"
          PER_PAGE: "15"
        run: python monitor.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update state_vibo_valentia.json [skip ci]"
          file_pattern: "state_vibo_valentia.json"

      # Avviso Telegram all'amministratore solo se il run fallisce.
      # Usa il bot RC perché è l'unico abilitato a inviare DM in privato.
      - name: Notifica fallimento su Telegram
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN_RC }}/sendMessage" \
            --data-urlencode chat_id="${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}" \
            --data-urlencode text="⚠️ Workflow FALLITO: USP VV Monitor
            Run: ${{ github.run_id }}
            Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
