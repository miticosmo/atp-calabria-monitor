name: DIAG VV connettivita

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Test endpoint da runner
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
          BASE="https://www.istruzione.calabria.it/vibovalentia"
          test_url () {
            echo "=== $1 ==="
            curl -s -o /dev/null \
              -w "http=%{http_code} time_total=%{time_total}s size=%{size_download} ip=%{remote_ip}\n" \
              -A "$UA" --max-time 45 "$1" || echo "FAILED/TIMEOUT su $1"
            echo
          }
          echo "Runner public IP:"
          curl -s --max-time 15 https://api.ipify.org || true
          echo; echo
          test_url "$BASE/"
          test_url "$BASE/feed/"
          test_url "$BASE/wp-json/wp/v2/posts?per_page=15&_embed=1"
          test_url "$BASE/wp-json/wp/v2/posts?per_page=15"
